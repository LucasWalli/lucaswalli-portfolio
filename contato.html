<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Walli</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="logo">
        <a href="sobre.html">Meu Portfólio</a>
    </div>
    <!-- Menu de navegação principal -->
    <nav class="site-nav">
        <ul>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="formacao.html">Formação</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>
    <!-- Botões do menu e do tema -->
    <div class="header-botoes">
        <button id="botao-menu">☰</button>
        <button id="botao-tema">🌙</button>
    </div>
</header>

<!-- Conteúdo principal da página -->
<main>
    <section>
        <h2>Entre em Contato</h2>

        <form id="form-contato">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>

        <p id="mensagem-status"></p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Lucas. Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
